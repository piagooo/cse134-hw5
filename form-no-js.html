            <form action="https://httpbin.org/post" method="post"  id="to-speak-or-to-die">
                <fieldset>
                    <legend>Say Something, Anything!</legend>
                    <small class="form-note">All fields are required.</small>

                    <form-field class="field">
                        <label for="user-name">Name (required): </label>
                        <input type="text" id="user-name" autocomplete="name" name="user-name" minlength="1" maxlength="100" required aria-describedby="user-name-hint">
                        <small class="hint" id="user-name-hint">1 to 100 characters. Any language, apostrophes and hyphens are fine.</small>
                    </form-field>

                    <form-field class="field">
                        <label for="user-email">Email Address (required): </label>
                        <input type="email" id="user-email" autocomplete="email" name="user-email" required aria-describedby="user-email-hint">
                        <small class="hint" id="user-email-hint">Use the format name@example.com.</small>
                    </form-field>
                        
                        
                    <form-field class="field">
                        <label for="user-message">Your Message (required):</label>
                
                        <textarea id="user-message" name="user-message" minlength="10" maxlength="1000" required aria-describedby="user-message-hint"></textarea>

                        <small class="hint" id="user-message-hint">10 to 1,000 characters.</small>
                    </form-field>

                    <input type="hidden" name="possible_bot" value="true">   
                        

                    <button type="submit">Send Message</button>
                </fieldset>
            </form>

    </body>
</html>
